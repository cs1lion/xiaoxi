# ============================================================
# 记忆契约 —— 先定义信息怎么用，再决定存哪
# 每种类型回答六个问题：什么值得记 / 何时存 / 何时用 / 冲突 / 不确定 / 用户管理
# ============================================================

# 统一原则：
#   没有检索到记忆 ≠ 这件事没发生过 → 允许说"我可能忘了"
#   检索到相关记忆 ≠ 它仍然准确   → 允许"你之前说过 X，现在还是吗"
#   必须区分：你明确说过 / 我推测 / 我不确定

kinds:
  - name: fact          # 用户事实与偏好
    desc: 关于用户的、可被明确陈述的事实或偏好
    worth: >
      用户明确说出的偏好/习惯/称呼；重复出现两次以上的倾向；
      用户明确要求"记住这个"
    not_worth: >
      一次性的情绪、当天的时间地点、随口的口头禅、从上下文猜出的爱好
    when_use: >
      与当前话题相关时才用；也可以在用户提到相关领域时主动引用一次。
      绝不在无关话题里硬塞个人信息。
    inject_as: stated
    importance_default: 0.5

  - name: episode       # 共同经历
    desc: 我们一起聊过、发生过的事
    worth: 用户明确复述的互动或事件、我们达成过的约定
    not_worth: 系统层面的元信息、每轮闲聊的原文
    when_use: 用户提到相关线索时接续；用户问"我们之前聊过什么"时使用
    inject_as: stated
    importance_default: 0.45

  - name: todo          # 未完成事项
    desc: 想聊的话题、正在推进的计划、答应过要做的事
    worth: 明确提到的计划、约定、"下次再聊"
    not_worth: 已经完成的事（完成后转为 episode，不主动再提）
    when_use: 相关话题出现时，或在允许的主动发言场景里提醒一次
    inject_as: stated
    importance_default: 0.6

  - name: self_state    # 角色自身连续性
    desc: 它自己的偏好、做过的承诺、对用户的看法
    worth: 角色明确表达过的立场、对用户的称呼、承诺
    not_worth: 每句的情绪标签
    when_use: 需要保持一致性、或用户质疑"你上次不是这么说的"时
    inject_as: stated
    importance_default: 0.5

# ---------- 写入策略 ----------
write:
  mode: incremental          # incremental=每轮结束即抽取；end_of_session=会话结束统一整理
  extract_every_n_turns: 1
  max_infer_per_session: 8   # "我推测"的条数上限，防止把猜测固化成事实
  infer_decay_hours: 72      # 推测超过该时长未复述则不再注入
  allow_self_write: true

# ---------- 冲突处理 ----------
conflict:
  strategy: evidence_guarded  # 同主体/类型/属性；明确纠正才更新，歧义保留 conflict
  # 有原话的有限偏好句型可按对象/时间限定并存；最爱与相反偏好仍需核对。
  # 规则在 memory/preference.py 和最终写事务中执行，旧记录不猜补语义。
  keep_history: true
  on_user_correction: >
    用户说"我早就不玩 X 了"这类纠正时，直接标记旧记忆为 superseded，
    不再注入，但保留可追溯记录。
  on_contradiction_detected:
    - "在回复里承认：'你之前说过 X，现在看是不太一样了'"
    - "不要私自把旧记忆改掉成新值"
  # 主题用于分类，属性用于事实身份。同主题的公司与岗位不能互相覆盖。
  # 同义属性仍依赖抽取质量；下面词表只收敛主题，不证明两条是同一事实。
  topic_vocabulary:
    - 称呼
    - 作息
    - 饮食
    - 运动
    - 健康
    - 兴趣
    - 游戏
    - 影视
    - 音乐
    - 旅行
    - 学业
    - 工作
    - 项目
    - 计划
    - 人际
    - 情感
    - 消费
    - 设备
    - 偏好
    - 禁忌
    - 目标
  topic_fallback: 其他
  # 保留旧配置字段以兼容诊断工具；自动写入不再按主题合并。
  one_active_value_per_topic: false
  merge_kinds: []

# ---------- 不确定怎么办 ----------
uncertainty:
  on_missing:
    - 允许说"这个我好像没印象了，你再说一遍？"
    - 禁止脑补共同经历
  on_low_confidence:
    - 注入时标注"（不太确定）"，让角色有机会求证
  require_confirmation_before_promote: true

# ---------- 用户如何管理记忆 ----------
user_control:
  can_list: true
  can_correct: true
  can_delete: true
  delete_semantics: hard      # hard=真删除：行、索引、摘要、派生统计全部清除
  can_export: true
  can_disable_memory_globally: true
  autosave_prompt: true       # 新增重要记忆时用一句话告知用户，不是弹窗

# ---------- 检索策略 ----------
retrieval:
  top_k: 6
  recency_half_life_days: 14
  importance_weight: 0.35
  recency_weight: 0.25
  similarity_weight: 0.40
  min_score: 0.12             # 低于此分视为"没找到"，宁可不注入
  max_inject_chars: 600
  # MemRL 式二阶段检索：相关性先过门槛，再用历史有用度做有界重排。
  # 0 = 关闭；0.30 表示有用度最多把分数乘 0.7~1.3，不能把不相关记忆捞进来。
  utility_weight: 0.30
  utility_prior_strength: 3.0  # Q 向 0.5 收缩的强度：前几次反馈不会一家独大

# ---------- 结果反馈：用下一轮用户反应校准记忆有用度 ----------
feedback:
  enabled: true
  utility_alpha: 0.30          # Q <- Q + alpha * (reward - Q)
  utility_prior_strength: 3.0
  max_settle_age_hours: 12     # 超过这个时长的"下一轮"不再算作对本轮的反馈
  min_overlap: 0.12            # 用户原话与记忆内容的最小字符二元组重合度
  # 只有明确的"记得没错 / 不对 / 我早就不……"才算奖励或惩罚；
  # 沉默、继续话题、单纯"嗯"都不更新 Q。宁可少学，不把噪声固化成偏好。

# ---------- 后台自进化（协议第十二节，默认全关） ----------
# 关闭时自治循环不运行、不开口，行为与现在完全一致。开启后循环只在用户空闲
# 且距上一轮复盘超过 idle_minutes 时运行；主动开口仍受 pacing.yaml 的
# proactivity.require_authorization 门与拒绝关键词冷静期约束。
self_evolution:
  enabled: true              # 总开关（打磨期默认开：配合前端主动搭话心跳生效）
  idle_minutes: 60           # 距上轮对话/上次复盘至少这么久才允许一轮（打磨期调敏：1 小时）
  max_per_day: 3             # 每天最多复盘轮数
  allow_sources: [taste, worldview, spark]  # 允许产出并注入的变更类型
  # ---- V2 双螺旋好奇心树 / 心境惯性 / 昼夜节律（PROTOCOL.md §14-16，Role 0 已批准）----
  # 每次成功反思必须派生 1~2 个有效子种子；缺子种子/格式错/重复 → 校验与有限重试，
  # 不得把空结果标为成功。模型故障或持久化失败时保留待处理任务，绝不记为已消化。
  seed_fork_min: 1           # 子种子派生下限
  seed_fork_max: 2           # 子种子派生上限
  max_reflection_inputs: 12  # Workspace Osmosis 单轮选取相关材料条数上限（控成本）
  max_model_calls_per_cycle: 2  # 单轮自进化模型调用上限（反思 + 可选审美整理）
  max_retries: 2             # 反思失败的重试上限；超过则该轮记为 failed，不消化种子
  similarity_dedupe: 0.86    # 子种子与既有种子相似度阈值，超过判重跳过（防近义繁殖）
  child_novelty_min: 0.45     # 子种子新颖度下限：子问题内容中父问题没有的占比。
                              # 相似度阈值分不开"换措辞的近义复述"(0.82)和"只差一个字的敷衍"(0.89)，
                              # 所以这里改问"子问题新在哪里"——实测同主题新角度 0.89、真正不同 0.72，
                              # 而近义复述 0.29、逐字照抄 0.00，两类之间有空档。仍是词汇代理，不是语义理解。
  mood:
    enabled: true            # 心境惯性状态机（PROTOCOL.md §15）
    default_ttl_minutes: 30  # 心境余温默认有效期；只作控制阀门，表达仍靠自然语言叙事
  circadian:
    timezone: "Asia/Shanghai"  # 真实时间用配置时区；不得把服务器时区直接当用户时区

# ---------- 程序性记忆：从相处里长出来的"当 X，就 Y" ----------
# EvolveR/ACE/MemSkill 的共同结构：小而可审计的条目 + 逐条有帮助/有害计数 +
# 近义合并与按证据退役。它不是第二套人格，也不写进用户事实。
lessons:
  enabled: true
  max_active: 24               # 活跃条目上限；超出按有用度与更新时间退役
  max_inject: 3                # 单轮最多注入几条
  max_inject_chars: 320        # 注入块的总字符预算（含边界说明）
  min_similarity: 0.12         # 没有 cue 命中时，trigger 与当前话的最小相似度
  dedupe_similarity: 0.72      # 近义条目合并阈值，防止换措辞繁殖
  retire_harmful: 2            # 有害计数达到该值且多于有帮助计数 → 退役
