# ============================================================
# V3 麾下 Worker 花名册 + 初审种子铁律
# 小溪（阿栖）不亲自干活：她照这张表选将、派单、验收。
#
# 每种 Agent 通过 `adapter:` 绑定到 server/assistant/adapters/ 下登记的适配器类
# （manual / cli_subproc / http_api / mcp）。新增一种干活方式 = 写一个适配器 +
# 在这里加一行，调度核心一行代码都不用改。
# ============================================================

version: 2

# ---------- 选将打分权重 ----------
# 只认这三项，不认"哪个模型最近表现好"这类无据可查的分数。
selection:
  strength_weight: 1.0        # 能力关键词命中意图的权重
  load_weight: 0.6            # 同 agent 未完结 Commission 的惩罚
  cost_weight: 0.4            # 琐事优先廉价档
  max_concurrent_default: 2   # 单个 Worker 同时在手的督办上限

# ---------- 派单预算 ----------
# 两把尺子分开量：
#   单次调用的上下文 = 质量闸。真机 CLI 一轮系统指令 + 工具目录约 10 万，
#   120k 留出余量；超过它才说明上下文真的膨胀。
#   整单累计 = 成本告警。重试/多次调用会累加，不能用它打回，只能进审核详情。
# 旧键 max_prompt_tokens 仍作为单次上限回退，避免旧 packet/probe 失效。
dispatch:
  max_steps: 4                # 单个 Worker 一轮最多几步
  max_prompt_tokens_per_call: 120000  # 单次调用 Prompt Token 质量闸
  max_total_prompt_tokens: 400000     # 整单累计成本告警线（不打回）
  max_retry: 2                # 初审打回上限；第 3 次不过转 BLOCKED 请示
  spin_guard:
    max_identical: 3          # 同一步骤签名连续重复几次算鬼打墙
  # 观测网关地址。配了执行体的 Agent，prepare_context 会把它注入环境变量，
  # 让 Worker 自己的模型调用也落到 agent_telemetry_spans 里。
  telemetry_proxy_url: "http://127.0.0.1:8000/internal/telemetry_proxy"

# ---------- 琐事代答策略 ----------
# BLOCKED 时：问题能在这里或已有偏好里找到依据 → 琐事，总管代答继续；
# 找不到依据 → 大事，起气泡请示老板，不猜。
trivia_policy:
  - pattern: "命名|起名|标题叫什么|用什么名字"
    answer: "按你上次定的偏好来：先短句，别用生僻词。我代你定了，不满意再喊停。"
  - pattern: "顺序|先做哪个|优先级"
    answer: "按截止时间排，最晚不能拖的那件先开刀。我代你定了。"

# ---------- Worker 花名册 ----------
# 三条现有编制都还是 adapter: manual——它们只接单、组密件，没有执行体。
# 真要让它干活，把 adapter / executable / endpoint 换成下面注释里的样子即可，
# 不需要改任何 Python 代码。
agents:
  - id: scribe
    name: 笔录官
    adapter: manual           # manual | cli_subproc | http_api | mcp
    summary: 便笺整理、标题、摘要、口吻改写；只读已保存版本，不新建文档
    strengths: [写作, 整理, 标题, 摘要, 便笺, 笔记, 文案, 改写, 润色]
    weaknesses: [不碰代码, 不做架构判断]
    cost_tier: cheap
    max_concurrent: 3
    eval_commands: [required_fields, artifacts_exist, token_budget]

  - id: builder
    name: 营造匠
    adapter: manual
    # 接线示例（把上面那行换成这两行即可让它真正跑起来）：
    # adapter: cli_subproc
    # executable: "claude"
    # args: ["--dangerously-skip-permissions"]
    summary: 前端页面、抽屉视图、样式与接线；严守主舞台 0 新增按钮
    strengths: [页面, 前端, 样式, 组件, 接线, 抽屉, 界面, 布局, 按钮]
    weaknesses: [不改后端契约, 不新增顶栏按钮]
    cost_tier: medium
    max_concurrent: 2
    eval_commands: [required_fields, artifacts_exist, wired_not_dry, no_topbar_button, token_budget]

  - id: scout
    name: 探马
    adapter: manual
    # 接线示例：
    # adapter: http_api
    # endpoint: "http://127.0.0.1:9000/v1/run"
    # method: POST
    summary: 检索、比对、查资料、汇总外部信息；只汇报查到的，不补全没查到的
    strengths: [检索, 查找, 搜索, 调研, 比对, 资料, 汇总, 查一下, 看看有没有]
    weaknesses: [不做最终决策, 不写长文]
    cost_tier: cheap
    max_concurrent: 2
    eval_commands: [required_fields, artifacts_exist, token_budget]

  # 真机 Worker：Claude Code 经本地 Anthropic 网关执行，成果落在
  # data/commissions/<commission_id>-<stamp>/out/，不写仓库根目录。
  # 网关由 scripts/run.py 自动拉起（127.0.0.1:15722）；没有网关时本单会明确
  # 阻塞为“网关不可用”，不会假装干过活。
  - id: claude
    name: 真机 Claude
    adapter: cli_subproc
    executable: "python"
    args: ["scripts/worker_shims/claude_worker.py"]
    timeout: 420
    env:
      AQI_GATEWAY_URL: "http://127.0.0.1:15722"
      AQI_CLAUDE_MODEL: "claude-opus-5-5"
      AQI_CLAUDE_TIMEOUT: "360"
      AQI_WORKSPACE_ROOT: "data/commissions"
    # 单次 prompt 实测 15.3–23.7 万 tokens（多轮工具调用累积，非系统提示开销），
    # 长期贴着 120K 质量闸。代码/脚本/测试/重构这类会触发多轮读写的活让给 dsh
    # （同一任务单次最高仅 2,586 tokens，见 issue #2 诊断）。Claude Code 保留它
    # 真正不可替代的短操作：单文件改写与跑命令。
    summary: 真机 Claude Code：单文件改写与跑命令；成果落在独立工作目录
    strengths: [文件, 写入, 修改, 命令, 修复]
    weaknesses: [不碰记忆与协议契约, 不做无法验证的审美判断]
    cost_tier: high
    max_concurrent: 1
    eval_commands: [required_fields, artifacts_exist, token_budget, acceptance_met]

  # WorkBuddy 5.8.3 自带 CodeBuddy CLI；shim 用 WorkBuddy.exe 以 Node 模式跑
  # cli/dist/codebuddy-lite-wb.mjs，原生说 OpenAI Chat。走 15722 的统一网关，
  # 不再单独依赖 15721。工具面收窄到读/写/编辑/检索，不给 Bash。
  - id: workbuddy
    name: 真机 WorkBuddy
    adapter: cli_subproc
    executable: "python"
    args: ["scripts/worker_shims/workbuddy_worker.py"]
    timeout: 420
    env:
      CODEBUDDY_BASE_URL: "http://127.0.0.1:15722/v1"
      CODEBUDDY_API_KEY: "PROXY_MANAGED"
      AQI_WORKBUDDY_MODEL: "step-5-preview"
      AQI_WORKBUDDY_TIMEOUT: "300"
      AQI_WORKSPACE_ROOT: "data/commissions"
    summary: 真机 WorkBuddy：文档、表格、汇报、整理与信息归纳；成果落在独立工作目录
    strengths: [文档, 表格, 汇报, 整理, 写作, 办公, 演示, 数据, 归纳, 总结, 文案]
    weaknesses: [不跑长命令, 不改后端契约, 不做无法验证的审美判断]
    cost_tier: medium
    max_concurrent: 1
    eval_commands: [required_fields, artifacts_exist, token_budget, acceptance_met]

  # DeepSeek Harness 的 headless profile：自带 read/write/bash、session 与
  # compaction，事件流最规整。走 15722 的 Anthropic 入口。
  - id: dsh
    name: 真机 DSH
    adapter: cli_subproc
    executable: "python"
    args: ["scripts/worker_shims/dsh_worker.py"]
    timeout: 420
    env:
      DEEPSEEK_BASE_URL: "http://127.0.0.1:15722"
      DEEPSEEK_API_KEY: "local"
      # 默认沙箱在本机拒绝写工作目录 / 起 pwsh；已验证 danger-full-access
      # 能写文件。隔离未解决前，这条只在独立 commission 工作目录里跑。
      DSH_PERMISSION_MODE: "danger-full-access"
      AQI_DSH_TIMEOUT: "300"
      AQI_WORKSPACE_ROOT: "data/commissions"
    # 自带 session 与 compaction，每轮只发增量：同一代码任务单次 prompt 最高
    # 2,586 tokens（Claude Code 同一任务 152,976）。长任务默认落这里。
    summary: 真机 DeepSeek Harness：多步任务、长上下文、代码、调研与分析与实现；成果落在独立工作目录
    strengths: [多步, 长任务, 调研, 分析, 代码, 脚本, 测试, 实现, 重构, 文件, 汇总, 计划, 检索, 修复]
    weaknesses: [不碰记忆与协议契约, 不做无法验证的审美判断]
    cost_tier: medium
    max_concurrent: 1
    eval_commands: [required_fields, artifacts_exist, token_budget, acceptance_met]

  # T2（issue #21）CLI 打样执行者：纯标准库确定性脚本，不接模型网关，专门
  # 打通「调度 -> 子进程 -> 遥测 -> 验收 -> 台账 -> commission_update 广播」
  # 全链。沙盒边界：不联网、不删除既有文件，只在每单独立工作目录新增一个
  # 校验产物。路由遵循 s5-d 分工（db82169）：代码/脚本/测试/实现/重构归
  # dsh，这里只接打样/沙盒/校验类受控小活，关键词不与 dsh/claude 重叠。
  - id: sandbox
    name: 沙盒打样工
    adapter: cli_subproc
    executable: "python"
    args: ["scripts/worker_shims/sandbox_worker.py"]
    timeout: 60
    env:
      AQI_WORKSPACE_ROOT: "data/commissions"
    summary: 沙盒打样：受控小任务真子进程执行（生成并回读校验一个小文件）；不联网、不删数据
    strengths: [打样, 沙盒, 校验, 演练, 受控]
    weaknesses: [不联网, 不删除既有文件, 只做受控小任务]
    cost_tier: cheap
    max_concurrent: 1
    eval_commands: [required_fields, artifacts_exist, token_budget, acceptance_met]

  # Codex 已接通（15722 的 /v1/responses 透传到 15721），但 Windows 上
  # workspace-write 沙箱起不来，只能 danger-full-access。按 Phase A 的 D-13，
  # 生产隔离没定之前不放进默认选将池；把 enabled 改成 true 即可启用。
  - id: codex
    name: 真机 Codex（待隔离决策）
    enabled: false
    adapter: cli_subproc
    executable: "python"
    args: ["scripts/worker_shims/codex_worker.py"]
    timeout: 420
    env:
      AQI_GATEWAY_URL: "http://127.0.0.1:15722/v1"
      AQI_GATEWAY_MODEL: "step-5-preview"
      AQI_CODEX_SANDBOX: "danger-full-access"
      AQI_CODEX_EFFORT: "low"
      AQI_WORKSPACE_ROOT: "data/commissions"
    summary: 真机 Codex：实现、修复与命令；当前仅探针可用，生产隔离未定
    strengths: [实现, 代码, 修复, 命令, 测试, 脚本, 重构]
    weaknesses: [需要 danger-full-access, 生产隔离未定]
    cost_tier: high
    max_concurrent: 1
    eval_commands: [required_fields, artifacts_exist, token_budget, acceptance_met]

# ---------- 适配器类型索引 ----------
# 这里只是给人看的目录；真正的登记发生在 server/assistant/adapters/ 各模块的
# @register_adapter("...") 上。花名册写一个没登记的类型，派单会转 BLOCKED 请示，
# 不会静默失败。
adapter_types:
  - manual        # 只组密件不执行；缺省值
  - cli_subproc   # 拉一个 CLI Agent 子进程，行协议见 PROTOCOL §22
  - http_api      # POST 给远端 Agent，支持 JSON 与 SSE 两种响应
  - mcp           # 经 Model Context Protocol 桥接一个 MCP Server
  - durable       # 交给本机 agent-runtime sidecar（pi-durable），崩溃可续跑

# ---------- 慢环执行内核（agent-runtime sidecar） ----------
# YAML 默认关闭；运行时用 `.env` 的 XIAOXI_DURABLE_ENABLED=1 点亮。测试会反复
# 启动 app，默认开启等于每条用例都拉一次 Node sidecar。开了之后 run.py 会先拉起
# sidecar（它独占 SQLite 与 Harness），再把端点与令牌绑到 adapter: durable 的
# 条目上；起不来不阻断主服务，派单会转 BLOCKED 并明说执行内核不可用。
durable:
  enabled: false
  directory: data/durable          # sidecar 的 SQLite 与日志落在哪
  node: node                       # 缺省用 PATH 里的 node
  startup_timeout: 15              # 等 sidecar 打印就绪的秒数
  auto_restart: true
  patrol_seconds: 60               # 探活间隔；sidecar 死了自动重起
  shadow: false                    # 只把委托镜像成 JSONL，不真的派给 durable
  shadow_log: data/durable-shadow.jsonl
  # durable 的 Worker 只能写这一个根目录下的每单独立子树（与 cli_subproc 的
  # AQI_WORKSPACE_ROOT 同一个根）。留空则不允许写文件，只交文字成果。
  workspace_root: data/commissions
  # 模型窗口与答案预算。compaction 的 reserve/keep/background 由 sidecar 按
  # 这两个值推导并断言 contextWindow - reserve > keep；需要覆盖再写下面三项。
  context_window: 32768
  max_tokens: 8000
  # reserve_tokens: 9024
  # keep_recent_tokens: 11872
  # background_tokens: 4096
  # 产品技能的专用目录（Agent Skills 布局：每个技能一个含 SKILL.md 的目录）。
  # 不要指向 .agents/skills——那是开发工具的技能，会漏进生产 Worker 的 prompt。
  skills_dir: config/skills
  # MCP server 配置。默认空文件 = 不连任何 server；工具会按
  # mcp__<server>__<tool> 注册，有副作用的工具自动走确认链。
  mcp_config: config/mcp.json
  # 需要老板确认后才放行的工具（逗号分隔）。MCP 的写工具会自动加入；这里只列
  # 额外的内置工具。run_worker 会按模型给的命令行拉起本地执行体，默认拦住；
  # write_file 留在沙箱里，不拦（否则每个文件任务都要老板点一次）。
  approval_tools: "run_worker"
  # 把指定 Worker 的 adapter 直接切成 durable，不改 YAML；运行时可用
  # XIAOXI_DURABLE_SWITCH_AGENTS=scribe 覆盖。durable 现在有 Skills、MCP、
  # compaction、read_file/write_file，但没有真机 CLI 的 Bash/Grep：代码类 Worker
  # 仍建议保留 cli_subproc，文档/整理类先切。
  switch_agents: [scribe]
  # C2 编排者 lease：默认 dry_run，人工确认后再切 auto。首期只允许 scribe；
  # 1 并发、3 单/小时、cost_tier<=medium、TTL 30 分钟。high 档/shell Worker
  # 不进入 C2 派单池，仍走现有 UI/人工路径。
  # lease_mode: dry_run

# ---------- 初审种子铁律 ----------
# 三条起步铁律：一条审美（L2），两条客观（L1）。
# 新的铁律只从"老板挑刺退回"里长出来，不手写堆砌。
seed_rules:
  - id: no_topbar_button
    layer: l2
    severity: blocker
    rule: 严禁在主舞台顶栏新增按钮；新入口只能落在侧滑工作台抽屉里
    triggers: [顶栏, topbar, 加个按钮, 顶部按钮]

  - id: no_unwired_dry_run
    layer: l1
    severity: blocker
    rule: 严禁未接线空跑：声称交付的每一项都必须有可达的 ref（文件路径/接口/便笺版本），不能只描述做了
    triggers: [未接线, 空跑, 假交付, 没接上]

  - id: prompt_token_bloat
    layer: l1
    severity: major
    rule: 控制 Prompt Tokens 异常膨胀：单个 Commission 超出预算即打回，先砍上下文再谈质量
    triggers: [token, 膨胀, 上下文太大, 预算超了]

# ---------- L1 客观校验阈值 ----------
eval_thresholds:
  token_bloat_ratio: 1.0      # 实际/预算比值超过即判膨胀
  max_summary_chars: 400      # 三句话卡的 summary 上限
  max_intercepted_chars: 400
