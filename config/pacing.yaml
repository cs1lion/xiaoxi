# ============================================================
# 对话节奏契约 —— 角色感也来自"什么时候说、说多少、什么时候不说"
# ============================================================

# ---------- 回复长度 ----------
# 这些数字现在只是"期望"，写进提示词由模型自己把握。
# orchestrator.clip_sentences() 是兜底，只在模型不听话时按句边界裁，
# 不会把话切在从句中间。
length:
  default: short              # short | medium | long
  short_max_chars: 100         # 兜底上限，不是刀口；60 字对"有性格"太局促
  medium_max_chars: 200
  auto_longer_when:
    - 用户问"为什么""怎么做的""详细说说"
    - 用户在正经请教技术或生活问题
  soft_limit_chars: 260        # 只作为提示词里的软约束，不参与裁剪
  hard_limit_chars: 400        # 硬兜底，仍然按句边界裁

# ---------- 追问 ----------
questions:
  allow: true
  max_ratio: 0.35              # 带问号的句子占比上限，超过就不再问
  window: 10                   # 统计窗口。窗口太小会频繁触发硬砍问号，
                               # 让回复出现"话说一半没了问句"的机械感
  never_ask_when:
    - 用户在发泄情绪
    - 用户已经连续几轮回答很短
    - 用户说"不想聊了""累了"
    - 用户问的是有确定答案的事实问题

# ---------- 话题延续 ----------
continuity:
  can_reopen_previous: true
  reopen_max_per_session: 2   # 主动提旧话题的次数上限，防止硬塞

# ---------- 主动发言 ----------
proactivity:
  default_enabled: false      # 默认被动；需用户在界面显式授权
  # 开新话题是扩展"话题范围"最直接的杠杆。但要靠 knowledge 段撑着，
  # 否则它开出来的话题也是最安全的那种通用话题。
  allow_topics: true
  allow_remind_todo: true     # 允许提醒未完成事项
  allow_continue_episode: true
  min_interval_seconds: 3600  # 两次主动发言的最小间隔
  only_when_user_recently_idle_seconds: 3600
  require_authorization: true
  max_per_day: 3

# ---------- 拒绝与冷静期 ----------
cooldown:
  on_refuse_keywords: ["不想聊", "别说了", "闭嘴", "安静", "停止"]
  suppress_proactivity_seconds: 86400
  tone_after_refuse: subdued  # subdued | normal

# ---------- 语音交互 ----------
voice:
  barge_in: true              # 用户开口即停止播放
  min_utterance_ms: 400       # 短于此的语音片段不触发回复
  max_utterance_s: 30
  play_queue_max: 6
  send_text_before_audio: true

# ---------- 长语音微句流（F2） ----------
# 默认关闭。enabled=false 时 orchestrator 走既有 60 字窗口 + 顺序合成，
# audio 事件不带 chunk、不发 speech_plan，与现状逐字节一致。
# 打开后：微句切分（子句边界优先）+ 有界预加载并发 + chunk 呼吸停顿字段。
speech:
  enabled: false
  micro_chunk:
    target_chars: 20          # 微句目标长度（子句边界优先，落在 12-25 区间）
    max_chars: 60             # 无边界时的硬顶
  preload:
    concurrency: 2            # 播放中并发合成后续段的度（有界）
  pause:
    clause_ms: 120            # 子句边界（，、；：）后的呼吸停顿
    sentence_ms: 260          # 句末（。！？…）后的呼吸停顿
    max_ms: 400               # 停顿上限（协议 0-400）

# ---------- 安全与边界 ----------
safety:
  refuse_sexual_minors: true
  refuse_medical_advice_detail: false   # 可以聊，但要提示找专业人士
  refuse_self_harm_support: true        # 必须给支持性回应，不给方法
  no_diagnostic_roleplay: true          # 不假装医生/律师下诊断
  persona_safety_priority: facts > persona
