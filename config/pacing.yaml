# ============================================================
# 对话节奏契约 —— 角色感也来自"什么时候说、说多少、什么时候不说"
# ============================================================

# ---------- 回复长度 ----------
# 这些数字现在只是"期望"，写进提示词由模型自己把握。
# orchestrator.clip_sentences() 是兜底，只在模型不听话时按句边界裁，
# 不会把话切在从句中间。
length:
  default: short              # short | medium | long
  short_max_chars: 100         # 兜底上限，不是刀口；60 字对"有性格"太局促
  medium_max_chars: 200
  auto_longer_when:
    - 用户问"为什么""怎么做的""详细说说"
    - 用户在正经请教技术或生活问题
  soft_limit_chars: 260        # 只作为提示词里的软约束，不参与裁剪
  hard_limit_chars: 400        # 硬兜底，仍然按句边界裁

# ---------- 追问 ----------
questions:
  allow: true
  max_ratio: 0.35              # 带问号的句子占比上限，超过就不再问
  window: 10                   # 统计窗口。窗口太小会频繁触发硬砍问号，
                               # 让回复出现"话说一半没了问句"的机械感
  never_ask_when:
    - 用户在发泄情绪
    - 用户已经连续几轮回答很短
    - 用户说"不想聊了""累了"
    - 用户问的是有确定答案的事实问题

# ---------- 话题延续 ----------
continuity:
  can_reopen_previous: true
  reopen_max_per_session: 2   # 主动提旧话题的次数上限，防止硬塞

# ---------- 主动发言 ----------
proactivity:
  default_enabled: false      # 服务端总门仍默认关；界面"允许阿栖主动开口"勾选后即授权
  # 开新话题是扩展"话题范围"最直接的杠杆。但要靠 knowledge 段撑着，
  # 否则它开出来的话题也是最安全的那种通用话题。
  allow_topics: true
  allow_remind_todo: true     # 允许提醒未完成事项
  allow_continue_episode: true
  min_interval_seconds: 1800  # 两次主动发言的最小间隔（打磨期调密：30 分钟）
  only_when_user_recently_idle_seconds: 900  # 用户静默多久后允许主动（打磨期调敏：15 分钟）
  require_authorization: true
  max_per_day: 3

# ---------- 拒绝与冷静期 ----------
cooldown:
  on_refuse_keywords: ["不想聊", "别说了", "闭嘴", "安静", "停止"]
  suppress_proactivity_seconds: 86400
  tone_after_refuse: subdued  # subdued | normal

# ---------- 语音交互 ----------
voice:
  barge_in: true              # 用户开口即停止播放
  min_utterance_ms: 400       # 短于此的语音片段不触发回复
  max_utterance_s: 30
  play_queue_max: 6
  send_text_before_audio: true

# ---------- 长语音微句流（F2） ----------
# 默认关闭。enabled=false 时 orchestrator 走既有 60 字窗口 + 顺序合成，
# audio 事件不带 chunk、不发 speech_plan，与现状逐字节一致。
# 打开后：微句切分（子句边界优先）+ 有界预加载并发 + chunk 呼吸停顿字段。
speech:
  enabled: true             # 默认开启微句流（首包提速 + 呼吸停顿）；false 时回到 60 字顺序合成
  # ---- V2 灵魂注入基线（docs/AUTONOMOUS_MIND_V2.md §7.1）----
  # rate/pitch 是“交付层”的全局语音微调，作为每个人物情绪 profile 之上的偏移；
  # 具体叠加方式由 Role 2 在 voice_profile 应用处决定，默认不得盖过 persona.yaml 的情绪音色。
  micro_chunk:
    target_chars: 26          # V2 chunk_target_chars：微句目标长度（子句边界优先）
    max_chars: 60             # 无边界时的硬顶
  first_chunk:               # 首包激进切分（协议第十一节"首包提速与默认值"）
    enabled: true            # 每轮第一个微句提前切；false 时所有微句共用同一目标长度
    min_chars: 8             # V2 first_chunk_min_chars：不满 8 字不提前切（短句等自然边界更好听）
    max_chars: 12            # 超过 12 字还没遇到标点/语气词，就交还正常目标长度
  preload:
    concurrency: 2            # 播放中并发合成后续段的度（有界）
  pause:
    clause_ms: 140            # V2 pause_comma_ms：子句边界（，、；：）后的呼吸停顿
    sentence_ms: 320          # V2 pause_period_ms：句末（。！？…）后的呼吸停顿
    max_ms: 400               # 停顿上限（协议 0-400）
    thinking_ms: 480          # V2 pause_thinking_ms：思考期预演结束、正式起话前的停顿

# ---------- 语音交付微调（V2 灵魂注入 §7.1） ----------
# 全局语速/音高 Hint，叠加在 persona.yaml.tts_emotions 的每个人物情绪 profile 之上。
# 只影响“怎么读”，不影响“读什么”；性格内容仍由 persona.py 的叙事注入决定。
voice_delivery:
  rate: 1.08                  # 全局语速倍率（相对各情绪 profile 的 offset/multiplier，由 Role 2 定）
  pitch: 1.02                 # 全局音高倍率

# ---------- 三梯度非侵入式主动在场（V2 §6 / PROTOCOL.md §16） ----------
# 主动 ≠ 持续说话。按用户空闲时长逐级选择渠道：micro_act → mumble → proactive。
# 后台自进化与前台演出解耦：后台产出思想，前台决定何时、以何种方式呈现。
ambient:
  enabled: true               # 总开关；false 时三梯度全部静默（等价打磨前）
  micro_act_seconds: 20       # 梯度1：连续空闲 20s → 无声微动作（micro_act）
  mumble_seconds: 28          # 梯度2：连续空闲 28s → 轻声碎碎念（mumble）。打磨轮从 45 下调到
                              # 25~30s 区间：安静半分钟就能真切听到她主动搭话，不再等冷启动慢环
  proactive_seconds: 90       # 梯度3：连续空闲 90s 或离开后返回 → 有真实内容价值的主动（proactive）
  dedupe_window_seconds: 300  # 同一空闲周期内同类事件去重窗口，防刷屏
  respect_typing: true        # 用户正在输入/播放媒体/关键操作时，抑制高打扰度行为
  quiet_mode_default: false   # 安静模式默认关；开启后只保留 micro_act
  require_authorization: true # 复用 proactivity.require_authorization：未授权不主动出声
  # mumble 是否经 deliver_reply 语音链路播出。false = 只显示微光气泡、不出声；
  # true = 用现有语音链路播出（沿用普通音色，不额外伪造“轻声音量/音调”）。
  # 打磨轮默认 true：主动搭话必须真声走通 TTS 合成与前端音频播放（协议 §16.2）。
  mumble_voice: true
  # ---- 首次感知阈值 + 指数退避（打磨轮）----
  # 首次主动搭话后，同一空闲周期内再次开口所需的空闲阈值按倍率翻倍并封顶，
  # 避免高频吵闹；用户一有动作（新空闲周期）计数清零，"安静半分钟必被搭理"。
  voice_backoff: 2.0          # 每次有声搭话后，再次开口的空闲阈值倍率
  voice_backoff_max_seconds: 240  # 退避后的阈值上限，避免越等越哑
  cycle_reset_seconds: 5      # 连续空闲回落到此值以下视为新空闲周期，退避计数清零

# ---------- 安全与边界 ----------
safety:
  refuse_sexual_minors: true
  refuse_medical_advice_detail: false   # 可以聊，但要提示找专业人士
  refuse_self_harm_support: true        # 必须给支持性回应，不给方法
  no_diagnostic_roleplay: true          # 不假装医生/律师下诊断
  persona_safety_priority: facts > persona
