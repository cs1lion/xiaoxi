# 契约 v2 配置（规范 §3.5）
#
# 说明：规范 §3.5 末尾写明「阈值不是常量，不要写死在代码里」，并且要用评测集
# A 类样本画「补全覆盖率 - 补全准确率」曲线来校准。评测集属于 §8，规范里缺失
# （见 docs/CONTRACT_V2_SCOPE.md §二），所以下面用的是**规范给的初始默认值**，
# 不是校准后的结论。
#
# 校准完成前不要调低 silent_fill_min：这一档用户看不到，规范要求准确率 ≥ 95%。
memory:
  silent_fill_min: 0.85
  confirm_fill_min: 0.70
  side_effect_slots_always_show: true

# 追问策略（§3.3）。上限是规范写死的 3 轮，换值需要重新论证追问疲劳。
clarification:
  max_rounds: 3

# 目标长度上限（§3.2 goal 约束）
goal:
  max_chars: 80

# 验收标准的硬上限（§3.7 L6 / L7）
lint:
  max_required_criteria: 8
  semantic_to_deterministic_ratio: 2.0
  # R1（§3.8）：命令白名单。
  #
  # 原先 L2 只有黑名单（rm -rf / format / dd if= ...），而黑名单永远漏：
  #   python -c "import shutil; shutil.rmtree('/')"
  # 不含任何危险词，却能删库。改成白名单 + 黑名单双道：
  #   白名单决定「能不能跑」，黑名单再兜一层「跑也不能这样跑」。
  #
  # 空列表 = 不启用白名单检查（保持旧行为，靠黑名单兜底）。
  # 填了之后，exit_code_zero 的 cmd 第一个词必须在白名单里（或匹配某个 glob），
  # 否则 L2 报错。只比较可执行体，不看参数里出现的危险词。
  # 只列「可执行体 + 允许的参数形态」，不要单写裸解释器。
  #
  # 教训：一开始写了裸 node，结果 node evil.js 也算白名单内——
  # 单 token 条目只比第一个词，等于放行该解释器的任意脚本。
  # 所以 node/npm/python 一律带 glob，把能跑的范围钉死。
  allowed_commands:
    - pytest
    - ruff
    - mypy
    - tsc
    - "node scripts/*.mjs"
    - "node --test*"
    - "npm run test"
    - "npm run test:*"
    - "python scripts/*.py"
    - "python -m pytest*"
    - "python3 scripts/*.py"
    - "py scripts/*.py"

# 预算默认值（§3.1 Budget；规范说这些都是配置项）
budget:
  max_retries: 3
  max_step_retries: 2
  max_wall_s: 900
