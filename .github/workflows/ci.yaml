# 轻量守卫（Lightweight PR/Push Guard）——拉代码 → 装依赖 → 跑契约与单测。
#
# 范围刻意收窄（克制原则）：只跑"零外部依赖"层——
#   1. scripts/check_protocol.py   协议契约静态校验（字段/路由/引用漂移）
#   2. scripts/test_*.py           由 scripts/ci_test_shard.py --workers 4 并发分片跑全集
#                                   （先 --self-test 校验并集=全集；缺夹具的用例按设计优雅跳过）
#   3. npm test                    Node 单测（无浏览器、无 GPU、不读模型文件）
#
# 明确不在 CI 跑的层（按 docs/TESTING.md 在本地执行）：
#   - 浏览器回归 scripts/test-*.browser.mjs：需要 Playwright + 本地服务 + gitignore 的 VRM 资产
#   - npm run test:eyes 中的模型夹具测试（test_eye_morph/test_eye_lids 读 web/models/*.vrm）
#   - scripts/eval_*.py --live：需要真实模型供应商凭据与预算
name: Aqi Mind CI

on:
  push:
    branches: ["main", "master", "v3-executive-secretary"]
  pull_request:
    branches: ["main", "master"]

jobs:
  guard:
    name: 轻量守卫（契约 + 单测 + 核心回归）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # 只装"零外部依赖"层用得到的包。音频栈（sounddevice / faster-whisper /
          # ctranslate2 / edge-tts）不在 CI 范围内：要么没人 import，要么是函数内
          # 懒加载。曾经用 requirements.txt 全量安装，卡在 libportaudio-dev 在
          # ubuntu-noble 上没有安装候选，导致任何测试都没跑就红。
          pip install -r requirements-ci.txt
          # 测试专用依赖（如 pytest/pillow）可选存在，不强制
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: 协议契约检查（静态，零依赖）
        run: python scripts/check_protocol.py

      # 记忆装配接缝静态契约门：build_context(3)/context_with_status(2) 的绑定
      # 点必须完整解包，否则 found 被静默丢弃、persona 的负向约束失效。零依赖，
      # 与协议契约门同级；不跑就等于把「必须 PASS」写进文档却没人执行。
      - name: 记忆装配接缝契约门（静态，零依赖）
        run: |
          python scripts/check_memory_contract.py --self-test
          python scripts/check_memory_contract.py

      - name: 回归评测（离线层，evals/cases）
        run: python scripts/run_evals.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Python 测试里有脚本会 shell out 到 Node：storage archive 的 hold-lock.ts、
      # worker shim 回归。Node 与这些依赖必须在 Python 测试之前就位；
      # pixel_world gate 已随世界工程分家（2026-11-05），主仓无目录时按设计 SKIP，
      # 不再需要这里为它准备 Node 依赖。
      - name: Install Node dependencies
        run: npm ci

      - name: Install agent-runtime dependencies
        working-directory: agent-runtime
        run: npm ci

      # 世界工程已分家（2026-11-05，见 docs/WORLD_SPLIT_20261105.md）：
      # pixel-world/ 由独立仓 cs1lion/pixel-world-engine 负责，新 clone 无该目录，
      # 其 Node 依赖安装与门禁不再属于主仓 CI。

      - name: Python 测试（并发分片，跳过计通过）
        run: |
          # 2026-11-06：原串行 for 循环实测 13-16 分钟。不能换成
          # run_gates.py --always（那一档只覆盖 ALWAYS_REQUIRED 子集，会砍掉大量回归），
          # 也不按「慢脚本跳过」提速——那同样是覆盖下降。这里保持
          # scripts/test_*.py 全集、只把串行改分片并发；先自检分片映射，
          # 并集漏一个或重复一个都会当场红，再实跑全部脚本。
          python scripts/ci_test_shard.py --workers 4 --self-test
          python scripts/ci_test_shard.py --workers 4

      - name: Node 单测（无浏览器 / 无模型依赖）
        run: npm test
