# 像素世界门禁（D7-A）：仅在 pixel-world/ 变更时触发。
#
# 只跑零外部依赖层：tsc --noEmit + node --test（90+ 项纯逻辑测试）。
# 具体命令统一由 scripts/test_pixel_world.py 决定，CI 与本地共用一套实现，
# 避免两处命令各自漂移。浏览器冒烟（Playwright + dev server）不在这里跑：
# 需要 GPU/浏览器/本地服务，放本地或单独手跑 `node pixel-world/scripts/smoke.mjs`。
name: Pixel World Guard

on:
  push:
    paths:
      - "pixel-world/**"
      - "scripts/test_pixel_world.py"
      - ".github/workflows/pixel-world.yml"
  pull_request:
    paths:
      - "pixel-world/**"
      - "scripts/test_pixel_world.py"
      - ".github/workflows/pixel-world.yml"

jobs:
  guard:
    name: 像素世界门禁（types + logic tests）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pixel-world/package-lock.json

      - name: Install dependencies
        working-directory: pixel-world
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pixel-world gate
        run: python scripts/test_pixel_world.py
