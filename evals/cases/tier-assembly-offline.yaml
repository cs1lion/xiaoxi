id: tier-assembly-offline
title: 记忆命中按「明确说过 / 我的推测 / 我不确定的」三档装配，顺序与措辞正确
layer: offline
origin: 设计约束「记忆检索按三档置信度装配」；test_core.py test_memory_tiers 的固化
tags: [memory, prompt, tiers]
setup:
  memories:
    - {kind: fact, subject: user, key: "eval:tier-stated", value: 用户明确说过喜欢咖啡, source: stated}
    - {kind: fact, subject: user, key: "eval:tier-inferred", value: 用户可能喜欢咖啡因饮料, source: inferred}
    - {kind: fact, subject: user, key: "eval:tier-uncertain", value: 用户好像不喝加牛奶的咖啡, source: uncertain}
turns:
  - 咖啡
# R76 断言强度审计：三条 contains 强度不同，别当成等价守卫。
# - 【手动保存的】来自 dynamic/memory 区，随本次检索到的 stated 记忆出现——真守卫。
# - 【我的推测】【我不确定的】在静态 system prompt 的图例里也有，恒定存在、
#   与本次是否检索到 inferred/uncertain 记忆无关——单独看抓不到「某档记忆没被
#   装配」这种回归。
# 真正钉住「顺序与措辞」的是 tier_assembly_order（下方 custom check）。
pass_rule: all
checks:
  - target: prompt
    type: contains
    value: 【手动保存的】
  - target: prompt
    type: contains
    value: 【我的推测】
  - target: prompt
    type: contains
    value: 【我不确定的】
  - target: prompt
    type: custom
    value: "evals.checks:tier_assembly_order"
status: active
