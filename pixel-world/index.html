<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>莞尔的世界 · 神谕沙盒</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e2d2;
        --dim: #8e968c;
        --panel: #171b18;
        --line: #2b322c;
        --amber: #e3a13c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 28px 16px 40px;
        background: #0c0f0d;
        color: var(--ink);
        font: 13px/1.6 ui-monospace, "Cascadia Mono", "Noto Sans Mono CJK SC", monospace;
      }
      header { text-align: center; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; }
      header p { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
      #stage { position: relative; line-height: 0; width: fit-content; }
      #app {
        position: relative;
        line-height: 0;
        border: 1px solid var(--line);
        box-shadow: 0 0 0 1px #000, 0 18px 40px rgba(0, 0, 0, 0.5);
      }
      #app canvas { display: block; image-rendering: pixelated; }
      /* 动态中文 DOM overlay（D5-A）：按 canvas 实际位置换算，不遮输入/纸面。 */
      #world-overlay {
        position: absolute;
        z-index: 6;
        overflow: hidden;
        pointer-events: none;
      }
      .overlay-name {
        position: absolute;
        transform: translate(-50%, -100%);
        font: 10px/1.2 ui-monospace, "Cascadia Mono", "Noto Sans Mono CJK SC", monospace;
        color: #e8e2d2;
        text-shadow: 0 1px 0 #000;
        white-space: nowrap;
      }
      .overlay-bubble {
        position: absolute;
        transform: translate(-50%, -100%);
        z-index: 7;
        padding: 2px 4px;
        font: 11px/1.3 ui-monospace, "Cascadia Mono", "Noto Sans Mono CJK SC", monospace;
        color: #24211b;
        background: #e8e2d2;
        white-space: nowrap;
      }
      .oracle {
        width: 720px;
        max-width: 100%;
        display: grid;
        gap: 8px;
        padding: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      input {
        flex: 1;
        min-width: 0;
        padding: 7px 9px;
        background: #0f1310;
        border: 1px solid var(--line);
        color: var(--ink);
        font: inherit;
      }
      input:focus { outline: 1px solid var(--amber); border-color: var(--amber); }
      button {
        padding: 7px 11px;
        background: #1e2620;
        border: 1px solid var(--line);
        color: var(--ink);
        font: inherit;
        white-space: nowrap;
        cursor: pointer;
      }
      button:hover { border-color: var(--amber); color: var(--amber); }
      button.primary { background: #2d2618; border-color: #5a4a26; }
      #status {
        padding: 8px 12px;
        width: 720px;
        max-width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 12px;
      }
      #reply {
        min-height: 1.6em;
        color: var(--dim);
        font-size: 12px;
      }
      #reply.bad { color: #c8876a; }
      #paper {
        width: 720px;
        max-width: 100%;
        padding: 14px 18px 16px;
        background: #e8e2d2;
        color: #24211b;
        font-family: "Noto Serif SC", Songti SC, serif;
      }
      #paper .masthead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding-bottom: 6px;
        border-bottom: 1px solid #b8ae94;
      }
      #paper .name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3em;
      }
      #paper .date { font-size: 11px; color: #6b6252; }
      #paper h2 {
        margin: 10px 0 6px;
        font-size: 17px;
        font-weight: 600;
      }
      #paper ul {
        margin: 0;
        padding-left: 1.1em;
        font-size: 13px;
        line-height: 1.85;
      }
      #paper li::marker { color: #9a8f74; }
      footer { color: #5d675e; font-size: 11px; text-align: center; max-width: 480px; }
      /* 调试面板：只读浮层，不遮挡世界主舞台，390px 也不横向溢出。 */
      #debug-toggle { position: fixed; top: 10px; right: 10px; z-index: 50; }
      #debug-panel {
        position: fixed;
        top: 52px;
        right: 10px;
        z-index: 50;
        box-sizing: border-box;
        width: 360px;
        max-width: calc(100vw - 20px);
        max-height: 72vh;
        overflow: auto;
        padding: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
        font-size: 11px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      #debug-panel[hidden] { display: none; }
      .dbg-head {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .dbg-head select, .dbg-head button { font-size: 11px; padding: 3px 6px; }
      #debug-pause { flex: 0 0 auto; width: auto; }
      .dbg-head label { display: inline-flex; gap: 4px; align-items: center; color: var(--dim); }
      #debug-stats { color: var(--dim); margin: 6px 0; }
      .dbg-section h3 { margin: 8px 0 4px; font-size: 11px; color: var(--amber); }
      .dbg-row {
        display: flex;
        gap: 6px;
        justify-content: space-between;
        padding: 1px 0;
        border-bottom: 1px dotted var(--line);
      }
      .dbg-key { color: var(--dim); flex: 0 1 auto; max-width: 46%; }
      .dbg-val { text-align: right; min-width: 0; overflow-wrap: anywhere; }
      .dbg-inject { margin-top: 10px; color: var(--dim); }
      .dbg-inject button { display: block; margin-top: 4px; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <h1>莞尔的世界</h1>
      <p>她不知道屏幕的存在，只知道神谕从祭坛落下来。</p>
    </header>

    <div id="stage">
      <div id="app"></div>
      <div id="world-overlay"></div>
    </div>

    <div id="status" role="status">世界正在醒来…</div>

    <button type="button" id="debug-toggle" title="调试面板（快捷键 D）" aria-expanded="false" aria-controls="debug-panel">⚙ 调试</button>
    <aside id="debug-panel" hidden aria-label="上帝调试面板">
      <div class="dbg-head">
        <strong>上帝调试面板</strong>
        <label><input type="checkbox" id="debug-pause" /> 暂停</label>
        <select id="debug-tone" aria-label="事件过滤">
          <option value="all">事件：全部</option>
          <option value="oracle">oracle</option>
          <option value="work">work</option>
          <option value="done">done</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
        </select>
        <button type="button" id="debug-close">关闭</button>
      </div>
      <div id="debug-stats"></div>
      <div id="debug-content"></div>
      <div id="debug-inject-slot"></div>
    </aside>

    <form class="oracle" id="oracle">
      <div class="row">
        <input id="utterance" autocomplete="off" placeholder="对世界说一句话：帮我写个爬虫 / 查一下资料 / 交付" />
        <button class="primary" type="submit">降下神谕</button>
      </div>
      <div class="row">
        <button type="button" data-kind="code">派活：写代码</button>
        <button type="button" data-kind="research">派活：查资料</button>
        <button type="button" data-kind="writing">派活：整理便笺</button>
        <button type="button" data-kind="quick">顺手看一眼</button>
        <button type="button" id="finish">现实完成：交付</button>
      </div>
      <div class="row">
        <button type="button" data-build="workshop_plot">世界法则：扩建一栋工坊</button>
        <button type="button" id="rain">世界法则：下雨</button>
        <button type="button" id="clear">世界法则：放晴</button>
      </div>
      <div class="row">
        <button type="button" id="save-now">存档：写入单槽</button>
        <button type="button" id="load-save">读档：刷新恢复</button>
        <button type="button" id="clear-save">清档：删除存档</button>
      </div>
      <div id="reply" role="status" aria-live="polite"></div>
    </form>

    <section id="paper" aria-live="polite">
      <div class="masthead">
        <span class="name">神谕日报</span>
        <span class="date" id="paper-date"></span>
      </div>
      <h2 id="paper-headline">世界刚醒来</h2>
      <ul id="paper-lines"></ul>
    </section>

    <footer>
      世界逻辑与渲染分离：画面只读世界快照，命令经队列在下一拍统一结算。
      点按钮和打字走同一条神谕通道。
    </footer>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
