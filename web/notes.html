<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿栖 · 个人笔记</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/editor-insights.css"><style>main{max-width:1000px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:1fr 1.4fr;gap:22px;margin-top:24px}label{display:block;margin:12px 0}input,textarea{width:100%;margin-top:5px}textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:220px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.note{display:block;width:100%;text-align:left;margin:9px 0}.note small{display:block;color:var(--muted)}#status{min-height:28px;color:var(--accent-2)}#source{overflow-wrap:anywhere}@media(max-width:700px){main{padding:18px}.layout{grid-template-columns:1fr}input,textarea{font-size:16px}}</style></head><body><main><header><h1>个人笔记</h1><a href="/">返回阿栖</a></header><p>只保存你明确提交的内容。笔记不自动加入聊天，也不会自动创建任务。</p><p id="status" role="status" aria-live="polite"></p><div class="layout"><section class="panel"><h2>找回你的资料</h2><form id="searchForm"><label>关键词<input id="query" maxlength="200" placeholder="搜索标题或正文"></label><button>搜索</button></form><p class="hint">按更新时间显示，最多 50 条；关键词为字面匹配。</p><div id="list"></div></section><section><form id="editor" class="panel"><h2 id="editorHeading">新建笔记</h2><p id="source" class="hint">来源：用户手动保存</p><label>标题<input id="title" maxlength="160" required></label><label>正文<textarea id="body" maxlength="20000" required></textarea></label><div class="actions"><button id="save">保存笔记</button><button id="new" type="button">新建</button><button id="delete" type="button" class="danger" disabled>删除此笔记</button><button id="prepare" type="button" disabled>准备任务草稿</button></div></form><section class="panel" id="taskDraft" hidden><h2>确认行动草稿</h2><p class="hint">这里只准备草稿，尚未创建任务。请把标题改成一个具体动作。</p><label>任务标题<input id="taskTitle" maxlength="160"></label><p id="taskSource" class="hint"></p><div class="actions"><button id="confirmTask">确认创建任务</button><button id="cancelTask">取消草稿</button></div><p class="hint">任务仅保存笔记 ID 与版本来源，不复制笔记正文。删除笔记不会删除已创建的任务。</p></section></section></div></main><script type="module" src="/static/notes.js"></script></body></html>
