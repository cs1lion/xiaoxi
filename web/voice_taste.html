<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿栖 · 语气试音台</title><link rel="stylesheet" href="/static/style.css"><style>main{max-width:850px;margin:auto;padding:28px}textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:12px;font:16px/1.6 inherit;background:var(--panel);color:inherit}.samples{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}article{padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#fffefa,#f0f3e8)}audio{width:100%;margin-top:12px}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin-top:14px}select{margin-left:8px}.hint{line-height:1.7}@media(max-width:600px){main{padding:18px}.samples{grid-template-columns:1fr}}</style></head><body><main><a href="/">← 返回阿栖</a><h1>同一句话，四种表达。</h1><p>固定音色与文字，先听出差别，再决定角色怎么说话。</p><p id="engine" class="hint">正在读取实际引擎…</p><label for="text">试音文字（最多 240 字）</label><textarea id="text" maxlength="240">先歇会儿，剩下的等会儿再说。</textarea><p class="hint">点击生成才请求当前 TTS 服务，可能产生费用。不会调用聊天模型，不修改默认语气。生成后不自动播放。</p><p id="status" role="status"></p><div class="samples" id="samples"></div><p class="hint">同一轮比较请保持文字不变；修改文字会清除已有样本。只比较当前引擎，不能把调语速当成完整情绪表演。</p></main><script type="module" src="/static/voice_taste.js"></script></body></html>
